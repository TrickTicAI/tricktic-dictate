<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recording</title><link rel="stylesheet" href="desktop-overlay.css">
<body><section aria-label="Dictation status">
  <div class="activity">
    <strong id="title" aria-live="polite">TrickTic Dictate</strong>
    <span id="opening" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
    <div id="bars" aria-hidden="true"></div>
    <span id="dash" aria-hidden="true"></span>
    <div id="loading" aria-hidden="true"><i></i><i></i><i></i></div>
    <span id="word" aria-hidden="true"></span>
    <span id="elapsed" aria-hidden="true"></span>
  </div>
  <span id="detail" aria-live="polite"></span>
  <nav aria-label="Dictation controls">
    <button data-action="start" aria-label="Start dictation" title="Start dictation" hidden><span class="rec"></span></button>
    <button data-action="stop" aria-label="Stop recording" title="Stop and paste" hidden><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" class="solid"/></svg></button>
    <button data-action="retry" aria-label="Retry transcription" title="Transcribe again — your audio is saved" hidden><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button data-action="open" aria-label="Open TrickTic Dictate" title="Open TrickTic Dictate for details" hidden><svg viewBox="0 0 26.5 20" class="mark"><rect x="0" y="6.6" width="2.5" height="6.8" rx="1.25"/><rect x="4" y="3.7" width="2.5" height="12.6" rx="1.25"/><rect x="8" y="1" width="2.5" height="18" rx="1.25"/><rect x="12" y="4.4" width="2.5" height="11.2" rx="1.25"/><rect x="16" y="2.3" width="2.5" height="15.5" rx="1.25"/><rect x="20" y="5.5" width="2.5" height="9" rx="1.25"/><rect x="24" y="7.3" width="2.5" height="5.4" rx="1.25"/></svg></button>
    <button data-action="cancel" aria-label="Discard dictation" title="Discard dictation" hidden><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
    <button data-action="dismiss" aria-label="Dismiss panel" title="Dismiss" hidden><svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </nav>
</section><script src="desktop-overlay.js"></script></body></html>
