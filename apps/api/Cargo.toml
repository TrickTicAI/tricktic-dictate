[package]
name = "metrix-writer-api"
default-run = "metrix-writer-api"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Opt-in allocator instrumentation for isolated synthetic upload measurements only.
cloud-upload-measure = []

[dependencies]
writer-dictation-audio = { path = "../../crates/dictation-audio" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

base64.workspace = true
futures-util = "=0.3.34"
tokio-util.workspace = true
async-trait.workspace = true
reqwest.workspace = true
uuid.workspace = true
schemars.workspace = true
sha2.workspace = true
earshot = "=1.2.2"
rusqlite = { version = "=0.40.2", features = ["bundled"] }

http-body = "=1.1.0"
http-body-util = "=0.1.5"
httpdate = "=1.0.3"

tower = { version = "=0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
