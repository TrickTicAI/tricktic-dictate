# Include inside nginx's http {}. Replace hostname/certificate paths for deployment.
# Writer stays on loopback, behind your separately configured access control.
map $upstream_http_content_security_policy $writer_csp {
    default $upstream_http_content_security_policy;
    "" "default-src 'none'; base-uri 'none'; frame-ancestors 'none'";
}
server {
    listen 443 ssl;
    server_name writer.example.invalid;
    ssl_certificate /etc/writer/tls/fullchain.pem;
    ssl_certificate_key /etc/writer/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTPS only; no includeSubDomains or preload commitment for other services.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    # Preserve Writer's actual policy; fail closed for proxy-generated errors.
    add_header Content-Security-Policy $writer_csp always;

    location / {
        proxy_pass http://127.0.0.1:8791;
        proxy_set_header Host $host;
        proxy_cache off;
        proxy_store off;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        # Align with the API's default byte ceiling; operators may choose less.
        client_max_body_size 1g;
    }
}
